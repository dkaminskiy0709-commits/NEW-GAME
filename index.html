<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест детей</title>
    <style>
        * { margin: 0; padding: 0; }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at center, #87CEEB 0%, #4A90D9 100%);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        // ===== ПРОСТОЙ ТЕСТ ДЕТЕЙ =====
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // Класс ребёнка
        class Child {
            constructor() {
                this.radius = 25;
                this.x = Math.random() * (canvas.width - 50) + 25;
                this.y = Math.random() * (canvas.height - 50) + 25;
                this.speedX = (Math.random() - 0.5) * 4;
                this.speedY = (Math.random() - 0.5) * 4;
                this.name = ['Аня', 'Петя', 'Маша', 'Коля', 'Оля'][Math.floor(Math.random() * 5)];
                this.color = ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF', '#FF6BFF'][Math.floor(Math.random() * 5)];
            }
            
            move() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 25 || this.x > canvas.width - 25) this.speedX = -this.speedX;
                if (this.y < 25 || this.y > canvas.height - 25) this.speedY = -this.speedY;
            }
            
            draw(ctx) {
                // Тело
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Глаза
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(this.x - 8, this.y - 5, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x + 8, this.y - 5, 6, 0, Math.PI * 2);
                ctx.fill();
                
                // Зрачки
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(this.x - 6, this.y - 3, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x + 10, this.y - 3, 3, 0, Math.PI * 2);
                ctx.fill();
                
                // Улыбка
                ctx.beginPath();
                ctx.arc(this.x, this.y + 4, 8, 0.1, Math.PI - 0.1);
                ctx.stroke();
                
                // Имя
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 8;
                ctx.fillText(this.name, this.x, this.y + this.radius + 22);
                ctx.shadowBlur = 0;
            }
        }
        
        // Создаём детей
        const children = [];
        for (let i = 0; i < 5; i++) {
            children.push(new Child());
        }
        
        console.log('✅ Создано детей:', children.length);
        
        // Игровой цикл
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (const child of children) {
                child.move();
                child.draw(ctx);
            }
            
            // Подсказка
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.font = '16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('👆 Вот они! 5 детей бегают!', canvas.width / 2, 50);
            
            requestAnimationFrame(gameLoop);
        }
        
        gameLoop();
        
        console.log('🎮 Игра запущена! Дети должны быть видны на экране.');
    </script>
</body>
</html>
