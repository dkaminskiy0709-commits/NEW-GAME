<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Tapper</title>
    <style>
        /* ===== НЕОНОВЫЙ СТИЛЬ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        body {
            font-family: 'Orbitron', monospace;
            background: #0B0014;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 0%, #1a0033, #0B0014 80%);
        }

        #app {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            background: #0B0014;
            border: 1px solid rgba(176, 38, 255, 0.2);
            box-shadow: 0 0 60px rgba(176, 38, 255, 0.15);
            border-radius: 32px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ===== ВЕРХНЯЯ ПАНЕЛЬ ===== */
        .top-panel {
            padding: 20px 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(176, 38, 255, 0.2);
            flex-shrink: 0;
        }

        .level-badge {
            background: rgba(176, 38, 255, 0.2);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            color: #B026FF;
            text-shadow: 0 0 20px rgba(176, 38, 255, 0.5);
            border: 1px solid rgba(176, 38, 255, 0.3);
        }

        .coins-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 0, 229, 0.1);
            padding: 6px 16px 6px 12px;
            border-radius: 30px;
            border: 1px solid rgba(255, 0, 229, 0.2);
        }

        .coin-icon {
            font-size: 20px;
            filter: drop-shadow(0 0 8px #FF00E5);
        }

        .coins-count {
            font-weight: 900;
            font-size: 18px;
            color: #FF00E5;
            text-shadow: 0 0 20px rgba(255, 0, 229, 0.4);
        }

        /* ===== ЦЕНТР - МОНСТР ===== */
        .monster-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            position: relative;
            min-height: 200px;
        }

        .monster-wrapper {
            position: relative;
            width: 100%;
            max-width: 280px;
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .monster-emoji {
            font-size: 120px;
            transition: all 0.1s ease;
            filter: drop-shadow(0 0 40px rgba(176, 38, 255, 0.6));
            line-height: 1;
            animation: float 2s ease-in-out infinite;
            cursor: pointer;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-12px) scale(1.03); }
        }

        .monster-emoji.hit {
            animation: hitAnim 0.15s ease !important;
        }

        @keyframes hitAnim {
            0% { transform: scale(0.7) rotate(-5deg); }
            50% { transform: scale(1.2) rotate(3deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* Полоска HP */
        .hp-bar-bg {
            width: 100%;
            max-width: 280px;
            height: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            margin-top: 10px;
            overflow: hidden;
            border: 1px solid rgba(176, 38, 255, 0.2);
        }

        .hp-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #B026FF, #FF00E5);
            border-radius: 20px;
            transition: width 0.1s linear;
            box-shadow: 0 0 20px rgba(176, 38, 255, 0.4);
        }

        .hp-text {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 6px;
            letter-spacing: 2px;
        }

        /* ===== КНОПКА ТАПА (как в Hamster) ===== */
        .tap-button-wrapper {
            padding: 10px 20px 20px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
        }

        .tap-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #B026FF, #5a009c);
            border: 3px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 60px rgba(176, 38, 255, 0.3), inset 0 -10px 30px rgba(0,0,0,0.5);
            color: #fff;
            font-size: 28px;
            font-weight: 900;
            font-family: 'Orbitron', monospace;
            cursor: pointer;
            transition: all 0.05s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
            touch-action: manipulation;
        }

        .tap-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 80px rgba(176, 38, 255, 0.5);
        }

        .tap-btn .sub {
            font-size: 12px;
            opacity: 0.7;
            font-weight: 400;
        }

        /* ===== НИЖНЯЯ НАВИГАЦИЯ ===== */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 10px 10px 18px;
            background: rgba(11, 0, 20, 0.9);
            border-top: 1px solid rgba(176, 38, 255, 0.15);
            flex-shrink: 0;
            backdrop-filter: blur(10px);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: 0.2s;
            padding: 4px 12px;
            border-radius: 12px;
            background: transparent;
            border: none;
            font-family: 'Orbitron', monospace;
        }

        .nav-item.active {
            color: #B026FF;
            text-shadow: 0 0 20px rgba(176, 38, 255, 0.3);
        }

        .nav-item .icon {
            font-size: 24px;
            filter: grayscale(0.3);
        }

        .nav-item.active .icon {
            filter: grayscale(0);
            text-shadow: 0 0 20px rgba(176, 38, 255, 0.5);
        }

        /* ===== ПАНЕЛИ (вкладки) ===== */
        .panel {
            display: none;
            flex: 1;
            padding: 10px 16px;
            overflow-y: auto;
            flex-direction: column;
            gap: 8px;
        }

        .panel.open {
            display: flex;
        }

        .panel-title {
            font-size: 16px;
            color: #B026FF;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(176, 38, 255, 0.2);
            border-bottom: 1px solid rgba(176, 38, 255, 0.1);
            padding-bottom: 8px;
        }

        /* Карточки улучшений */
        .upgrade-card {
            background: rgba(176, 38, 255, 0.05);
            border: 1px solid rgba(176, 38, 255, 0.15);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }

        .upgrade-card .info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .upgrade-card .name {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }

        .upgrade-card .desc {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
        }

        .upgrade-card .level {
            font-size: 11px;
            color: #FF00E5;
        }

        .buy-btn {
            background: #B026FF;
            border: none;
            color: #fff;
            padding: 6px 16px;
            border-radius: 30px;
            font-family: 'Orbitron', monospace;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 0 20px rgba(176, 38, 255, 0.2);
        }

        .buy-btn:active {
            transform: scale(0.95);
        }

        .buy-btn:disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        /* Достижения */
        .achieve-item {
            background: rgba(255, 0, 229, 0.03);
            border-left: 3px solid #B026FF;
            padding: 10px 14px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .achieve-item.done {
            border-left-color: #FF00E5;
            opacity: 0.6;
        }

        .achieve-item .title {
            font-size: 12px;
        }

        .achieve-item .status {
            font-size: 18px;
        }

        /* ===== СКРОЛЛ ===== */
        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #B026FF;
            border-radius: 10px;
        }

        /* ===== ВСПЛЫВАЮЩИЙ УРОН ===== */
        .damage-float {
            position: fixed;
            font-weight: 900;
            font-size: 28px;
            color: #FF00E5;
            text-shadow: 0 0 30px rgba(255, 0, 229, 0.8);
            pointer-events: none;
            animation: floatUp 0.9s ease-out forwards;
            z-index: 999;
            font-family: 'Orbitron', monospace;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-120px) scale(1.6); }
        }

        /* адаптив */
        @media (max-width: 420px) {
            .monster-emoji { font-size: 80px; }
            .tap-btn { width: 130px; height: 130px; font-size: 22px; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- ВЕРХ -->
    <div class="top-panel">
        <div class="level-badge">🔥 УР. <span id="levelDisplay">1</span>/100</div>
        <div class="coins-box">
            <span class="coin-icon">💎</span>
            <span class="coins-count" id="coinsDisplay">0</span>
        </div>
    </div>

    <!-- ОСНОВНАЯ ИГРОВАЯ ОБЛАСТЬ (всегда видна) -->
    <div id="gameArea" style="flex:1; display:flex; flex-direction:column;">
        <div class="monster-area">
            <div class="monster-wrapper">
                <div class="monster-emoji" id="monsterEmoji">👾</div>
            </div>
            <div class="hp-bar-bg">
                <div class="hp-bar-fill" id="hpFill" style="width:100%"></div>
            </div>
            <div class="hp-text" id="hpText">HP: 100 / 100</div>
        </div>

        <div class="tap-button-wrapper">
            <button class="tap-btn" id="tapBtn">
                💥
                <span>ТАП</span>
                <span class="sub">+<span id="damagePreview">1</span></span>
            </button>
        </div>
    </div>

    <!-- ПАНЕЛИ (вкладки) -->
    <div id="upgradePanel" class="panel">
        <div class="panel-title">⚡ УЛУЧШЕНИЯ (20)</div>
        <div id="upgradeList"></div>
    </div>

    <div id="achievePanel" class="panel">
        <div class="panel-title">🏆 ДОСТИЖЕНИЯ (20)</div>
        <div id="achieveList"></div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <div class="bottom-nav">
        <button class="nav-item active" data-panel="game" id="navGame">🎯<span>БОЙ</span></button>
        <button class="nav-item" data-panel="upgrade" id="navUpgrade">⬆️<span>АПГРЕЙД</span></button>
        <button class="nav-item" data-panel="achieve" id="navAchieve">🏅<span>АЧИВКИ</span></button>
    </div>
</div>

<script>
    // ============================================================
    //  ПОЛНЫЙ ИГРОВОЙ ДВИЖОК
    // ============================================================

    // ---- ДАННЫЕ ----
    const MONSTERS = ['👾', '👹', '💀', '👻', '🤖', '👽', '☠️', '🧛', '🦇', '🐉'];
    const UPGRADE_NAMES = [
        { name: 'Неоновый кулак', desc: '+1 урон', baseCost: 10, costMulti: 1.5, maxLvl: 10, effect: (lvl) => lvl },
        { name: 'Критический разряд', desc: 'шанс x2', baseCost: 25, costMulti: 1.6, maxLvl: 5, effect: (lvl) => lvl * 0.08 },
        { name: 'Вампиризм', desc: '+монеты за тап', baseCost: 40, costMulti: 1.7, maxLvl: 3, effect: (lvl) => lvl },
        { name: 'Саботаж', desc: 'монстр слабее %', baseCost: 60, costMulti: 1.8, maxLvl: 2, effect: (lvl) => lvl * 0.05 },
    ];

    const ACHIEVEMENTS = [
        { id: 'a1', title: 'Первая кровь', check: s => s.totalKills >= 1 },
        { id: 'a2', title: 'Охотник 10', check: s => s.totalKills >= 10 },
        { id: 'a3', title: 'Охотник 100', check: s => s.totalKills >= 100 },
        { id: 'a4', title: 'Охотник 500', check: s => s.totalKills >= 500 },
        { id: 'a5', title: 'Пальцы-дрель', check: s => s.maxCombo >= 50 },
        { id: 'a6', title: 'Тап-машина', check: s => s.totalTaps >= 1000 },
        { id: 'a7', title: 'Тап-легенда', check: s => s.totalTaps >= 10000 },
        { id: 'a8', title: 'Босс-киллер', check: s => s.bossKills >= 1 },
        { id: 'a9', title: 'Электрошокер', check: s => s.bossKills >= 5 },
        { id: 'a10', title: 'Миллионер', check: s => s.coins >= 10000 },
        { id: 'a11', title: 'Убийца теней', check: s => s.totalKills >= 250 },
        { id: 'a12', title: 'Неутомимый', check: s => s.totalTaps >= 500 },
        { id: 'a13', title: 'Скорость неона', check: s => s.maxCombo >= 20 },
        { id: 'a14', title: 'Демон-истребитель', check: s => s.totalKills >= 50 },
        { id: 'a15', title: 'Фиолетовая чума', check: s => s.coins >= 5000 },
        { id: 'a16', title: 'Мастер апгрейда', check: s => s.upgradeSum >= 10 },
        { id: 'a17', title: 'Гранд-мастер', check: s => s.upgradeSum >= 20 },
        { id: 'a18', title: 'Бессмертный', check: s => s.totalKills >= 1000 },
        { id: 'a19', title: 'Король тапа', check: s => s.maxCombo >= 100 },
        { id: 'a20', title: 'Легенда неона', check: s => s.totalKills >= 1500 },
    ];

    // ---- СОСТОЯНИЕ ----
    let state = {
        level: 1,
        coins: 0,
        maxHp: 100,
        hp: 100,
        monsterIdx: 0,
        baseDamage: 1,

        // улучшения
        upgrades: [0,0,0,0], // текущие уровни

        // статистика
        totalKills: 0,
        totalTaps: 0,
        maxCombo: 0,
        combo: 0,
        bossKills: 0,
        upgradeSum: 0,

        // для ачивок
        achieved: new Set(),
    };

    // ---- DOM ----
    const $ = id => document.getElementById(id);
    const monsterEmoji = $('monsterEmoji');
    const hpFill = $('hpFill');
    const hpText = $('hpText');
    const levelDisplay = $('levelDisplay');
    const coinsDisplay = $('coinsDisplay');
    const damagePreview = $('damagePreview');
    const tapBtn = $('tapBtn');

    // ---- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ----
    function getMonster() {
        return MONSTERS[state.monsterIdx % MONSTERS.length];
    }

    function getMaxHp() {
        // Босс (каждый 10-й) имеет x5 HP
        const base = 80 + state.level * 20;
        if (state.level % 10 === 0) return base * 5;
        // Саботаж: уменьшаем HP
        const sabLvl = state.upgrades[3];
        const reduce = 1 - (sabLvl * 0.05);
        return Math.floor(base * reduce);
    }

    function getDamage() {
        const lvl1 = state.upgrades[0]; // Неоновый кулак
        let dmg = 1 + lvl1;
        // крит
        const critLvl = state.upgrades[1];
        const critChance = critLvl * 0.08;
        if (Math.random() < critChance) dmg *= 2;
        return Math.floor(dmg);
    }

    function getCoinReward() {
        const base = 1 + Math.floor(state.level / 5);
        const vampLvl = state.upgrades[2];
        return base + vampLvl;
    }

    function getUpgradeCost(idx) {
        const lvl = state.upgrades[idx];
        const data = UPGRADE_NAMES[idx];
        return Math.floor(data.baseCost * Math.pow(data.costMulti, lvl));
    }

    // ---- ОСНОВНАЯ ЛОГИКА ----
    function spawnMonster() {
        state.maxHp = getMaxHp();
        state.hp = state.maxHp;
        monsterEmoji.textContent = getMonster();
        // смена эмодзи при боссе
        if (state.level % 10 === 0) {
            monsterEmoji.textContent = '👾';
            // можно добавить анимацию босса
        }
        updateUI();
    }

    function takeDamage() {
        const dmg = getDamage();
        state.hp -= dmg;
        state.totalTaps++;
        state.combo++;
        if (state.combo > state.maxCombo) state.maxCombo = state.combo;

        // всплывающий урон
        showDamageFloat(dmg);

        // анимация удара
        monsterEmoji.classList.remove('hit');
        void monsterEmoji.offsetWidth;
        monsterEmoji.classList.add('hit');

        // вибрация (если в телеге - добавить)
        if (navigator.vibrate) navigator.vibrate(10);

        // вампиризм: монеты за тап
        const vampLvl = state.upgrades[2];
        if (vampLvl > 0) {
            state.coins += vampLvl;
        }

        if (state.hp <= 0) {
            killMonster();
        }

        updateUI();
        checkAchievements();
        saveGame();
    }

    function killMonster() {
        const reward = getCoinReward();
        state.coins += reward;
        state.totalKills++;
        if (state.level % 10 === 0) state.bossKills++;

        state.level++;
        state.combo = 0;

        // сброс комбо при переходе

        if (state.level > 100) {
            state.level = 100;
            // победа
            alert('🏆 ТЫ ПРОШЕЛ ВСЕ 100 УРОВНЕЙ! Ты легенда!');
            return;
        }

        spawnMonster();
        updateUI();
        checkAchievements();
        saveGame();
    }

    function showDamageFloat(dmg) {
        const el = document.createElement('div');
        el.className = 'damage-float';
        el.textContent = '-' + dmg;
        const rect = tapBtn.getBoundingClientRect();
        el.style.left = (rect.left + rect.width/2 - 30) + 'px';
        el.style.top = (rect.top - 20) + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 900);
    }

    // ---- УЛУЧШЕНИЯ ----
    function buyUpgrade(idx) {
        const cost = getUpgradeCost(idx);
        if (state.coins < cost) return;
        if (state.upgrades[idx] >= UPGRADE_NAMES[idx].maxLvl) return;

        state.coins -= cost;
        state.upgrades[idx]++;
        state.upgradeSum++;
        spawnMonster(); // пересчет HP под саботаж
        updateUI();
        renderUpgrades();
        checkAchievements();
        saveGame();
    }

    // ---- UI ОБНОВЛЕНИЕ ----
    function updateUI() {
        const hpPercent = (state.hp / state.maxHp * 100);
        hpFill.style.width = Math.max(0, hpPercent) + '%';
        hpText.textContent = `HP: ${Math.max(0, Math.floor(state.hp))} / ${state.maxHp}`;
        levelDisplay.textContent = state.level;
        coinsDisplay.textContent = state.coins;
        damagePreview.textContent = getDamage();
    }

    // ---- ОТРИСОВКА ПАНЕЛЕЙ ----
    function renderUpgrades() {
        const container = $('upgradeList');
        container.innerHTML = '';
        UPGRADE_NAMES.forEach((u, i) => {
            const lvl = state.upgrades[i];
            const cost = getUpgradeCost(i);
            const maxed = lvl >= u.maxLvl;
            const div = document.createElement('div');
            div.className = 'upgrade-card';
            div.innerHTML = `
                <div class="info">
                    <span class="name">${u.name}</span>
                    <span class="desc">${u.desc} | Ур. ${lvl}/${u.maxLvl}</span>
                </div>
                <button class="buy-btn" ${maxed || state.coins < cost ? 'disabled' : ''}>
                    ${maxed ? 'MAX' : cost + '💎'}
                </button>
            `;
            div.querySelector('.buy-btn').addEventListener('click', () => buyUpgrade(i));
            container.appendChild(div);
        });
    }

    function renderAchievements() {
        const container = $('achieveList');
        container.innerHTML = '';
        ACHIEVEMENTS.forEach((a) => {
            const done = state.achieved.has(a.id);
            const div = document.createElement('div');
            div.className = `achieve-item ${done ? 'done' : ''}`;
            div.innerHTML = `
                <span class="title">${done ? '✅' : '⬜'} ${a.title}</span>
                <span class="status">${done ? '🏆' : '🔒'}</span>
            `;
            container.appendChild(div);
        });
    }

    // ---- ДОСТИЖЕНИЯ ----
    function checkAchievements() {
        let changed = false;
        ACHIEVEMENTS.forEach(a => {
            if (!state.achieved.has(a.id) && a.check(state)) {
                state.achieved.add(a.id);
                changed = true;
                // бонус монет
                state.coins += 50;
                // уведомление
                showFloatNotif('🏆 ' + a.title);
            }
        });
        if (changed) {
            updateUI();
            renderAchievements();
            saveGame();
        }
    }

    function showFloatNotif(text) {
        const el = document.createElement('div');
        el.className = 'damage-float';
        el.textContent = text;
        el.style.color = '#FFD700';
        el.style.fontSize = '20px';
        el.style.left = '50%';
        el.style.top = '40%';
        el.style.transform = 'translateX(-50%)';
        el.style.textShadow = '0 0 40px gold';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1500);
    }

    // ---- НАВИГАЦИЯ ----
    function switchPanel(panel) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('open'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

        if (panel === 'game') {
            $('gameArea').style.display = 'flex';
            document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
        } else {
            $('gameArea').style.display = 'none';
            const p = document.getElementById(panel + 'Panel');
            if (p) {
                p.style.display = 'flex';
                p.classList.add('open');
                if (panel === 'upgrade') renderUpgrades();
                if (panel === 'achieve') renderAchievements();
            }
        }

        document.querySelector(`.nav-item[data-panel="${panel}"]`)?.classList.add('active');
    }

    // ---- СОХРАНЕНИЕ ----
    function saveGame() {
        try {
            const data = {
                level: state.level,
                coins: state.coins,
                upgrades: state.upgrades,
                totalKills: state.totalKills,
                totalTaps: state.totalTaps,
                maxCombo: state.maxCombo,
                bossKills: state.bossKills,
                upgradeSum: state.upgradeSum,
                achieved: Array.from(state.achieved),
            };
            localStorage.setItem('neonTapper', JSON.stringify(data));
        } catch(e) {}
    }

    function loadGame() {
        try {
            const raw = localStorage.getItem('neonTapper');
            if (!raw) return;
            const data = JSON.parse(raw);
            state.level = data.level || 1;
            state.coins = data.coins || 0;
            state.upgrades = data.upgrades || [0,0,0,0];
            state.totalKills = data.totalKills || 0;
            state.totalTaps = data.totalTaps || 0;
            state.maxCombo = data.maxCombo || 0;
            state.bossKills = data.bossKills || 0;
            state.upgradeSum = data.upgradeSum || 0;
            if (data.achieved) data.achieved.forEach(id => state.achieved.add(id));
        } catch(e) {}
        spawnMonster();
        updateUI();
        renderUpgrades();
        renderAchievements();
    }

    // ---- ИНИЦИАЛИЗАЦИЯ ----
    document.addEventListener('DOMContentLoaded', () => {
        loadGame();

        // Тап
        tapBtn.addEventListener('click', (e) => {
            e.preventDefault();
            takeDamage();
        });
        // Тап по монстру
        monsterEmoji.addEventListener('click', (e) => {
            e.preventDefault();
            takeDamage();
        });

        // Навигация
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', () => {
                const panel = btn.dataset.panel;
                switchPanel(panel);
            });
        });

        // Клавиша пробел для тапа
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat) {
                e.preventDefault();
                takeDamage();
            }
        });

        // Авто-сохранение каждые 10 сек
        setInterval(saveGame, 10000);
    });

    // ---- ОБРАБОТКА СВЕРТЫВАНИЯ (для TG) ----
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') saveGame();
    });
</script>
</body>
</html>
